version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    image: shortify-backend:latest  # ✅ Named image for reuse
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - ./backend/shortify-876e7-firebase-adminsdk-fbsvc-9193bebcff.json:/app/firebase-credentials.json
      - ./backend/uploads:/app/uploads

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hariom_715
      POSTGRES_DB: Shortify
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  celery:
    image: shortify-backend:latest  # ✅ Reuse backend image
    command: celery -A app.core.celery_app worker --loglevel=info --pool=solo --queues=shorts
    depends_on:
      - backend
      - redis
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./backend/shortify-876e7-firebase-adminsdk-fbsvc-9193bebcff.json:/app/firebase-credentials.json
      - ./backend/uploads:/app/uploads

  celery-beat:
    image: shortify-backend:latest  # ✅ Reuse backend image
    command: celery -A app.core.celery_app beat --loglevel=info
    depends_on:
      - backend
      - redis
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./backend/shortify-876e7-firebase-adminsdk-fbsvc-9193bebcff.json:/app/firebase-credentials.json

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d
      - ./nginx/certbot/conf:/etc/letsencrypt
      - ./nginx/certbot/www:/var/www/certbot
    depends_on:
      - frontend

  certbot:
  image: certbot/certbot
  container_name: certbot
  volumes:
    - ./nginx/certbot/conf:/etc/letsencrypt
    - ./nginx/certbot/www:/var/www/certbot
  command: certonly --webroot --webroot-path=/var/www/certbot --email singh.omhari715@gmail.com --agree-tos --no-eff-email --non-interactive -d kwixlab.com -d www.kwixlab.com

volumes:
  db_data: {}
