version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    image: shortify-backend:latest  # ✅ Named image for reuse
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app
      - ./backend/shortify-876e7-firebase-adminsdk-fbsvc-9193bebcff.json:/app/firebase-credentials.json
      - ./backend/uploads:/app/uploads

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hariom_715
      POSTGRES_DB: Shortify
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  celery:
    image: shortify-backend:latest  # ✅ Reuse backend image
    command: celery -A app.core.celery_app worker --loglevel=info --pool=solo --queues=shorts
    depends_on:
      - backend
      - redis
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./backend/shortify-876e7-firebase-adminsdk-fbsvc-9193bebcff.json:/app/firebase-credentials.json
      - ./backend/uploads:/app/uploads

  celery-beat:
    image: shortify-backend:latest  # ✅ Reuse backend image
    command: celery -A app.core.celery_app beat --loglevel=info
    depends_on:
      - backend
      - redis
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - ./backend/shortify-876e7-firebase-adminsdk-fbsvc-9193bebcff.json:/app/firebase-credentials.json

volumes:
  db_data: {}
