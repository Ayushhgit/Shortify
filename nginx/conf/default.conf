# HTTP: redirect everything to HTTPS, except ACME challenge
server {
    listen 80;
    server_name kwixlab.com www.kwixlab.com;

    # Serve Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name kwixlab.com www.kwixlab.com;

    ssl_certificate /etc/letsencrypt/live/kwixlab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kwixlab.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ✅ API requests go to backend
    location ~ ^/(api|ai|clip|analyze|render|payment|extract-resume|generate-cover-letter|interview-prep|shorts|uploads|chat|outputs|resume|pdf|review|article|eda|handwriting|export|quiz|interview|coverletter|stock|linkwise|chatbot|health|docs|redoc)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        send_timeout 600s;
        proxy_buffering off;
    }

    # ✅ Frontend for everything else
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
