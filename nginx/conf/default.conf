server {
    listen 443 ssl;
    server_name kwixlab.com www.kwixlab.com;

    ssl_certificate /etc/letsencrypt/live/kwixlab.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kwixlab.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ✅ API requests go to backend
    location ~ ^/(api|ai|clip|analyze|render|extract-resume|generate-cover-letter|interview-prep|shorts|uploads|chat|outputs|resume|pdf|review|article|eda|handwriting|export|quiz|interview|coverletter|stock|linkwise|chatbot|health|docs|redoc)(/|$) {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ✅ Frontend for everything else
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
